<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>训练计划</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <noscript>
    <div style="padding:24px;color:#f5f5f5;font-family:sans-serif;background:#0a0a0a;min-height:100vh">
      此应用需要 JavaScript 才能运行,请在浏览器设置中开启。
    </div>
  </noscript>
  <!-- SVG icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-today" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M5.6 18.4l2.1-2.1M12 18v3M18.4 18.4l-2.1-2.1M21 12h-3M18.4 5.6l-2.1 2.1"/>
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
      </symbol>
      <symbol id="i-plan" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M3 9h18" stroke="currentColor" stroke-width="2"/>
        <path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="8" cy="14" r="1.2" fill="currentColor"/>
        <circle cx="12" cy="14" r="1.2" fill="currentColor"/>
        <circle cx="16" cy="14" r="1.2" fill="currentColor"/>
        <circle cx="8" cy="18" r="1.2" fill="currentColor"/>
        <circle cx="12" cy="18" r="1.2" fill="currentColor"/>
      </symbol>
      <symbol id="i-me" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12l5 5L20 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" fill="currentColor"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-chev" viewBox="0 0 24 24">
        <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-fire" viewBox="0 0 24 24">
        <path d="M12 2c1 3 4 4 4 8a4 4 0 0 1-4 4 4 4 0 0 1-4-4c0-2 1-3 1-5 1 2 3 1 3-3z M7 14c-1 1-2 3-2 5a7 7 0 0 0 14 0c0-2-1-4-2-5-1 3-3 4-5 4s-4-1-5-4z"
          fill="currentColor"/>
      </symbol>
      <symbol id="i-flash" viewBox="0 0 24 24">
        <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="currentColor"/>
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M4 20h4l11-11-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-camera" viewBox="0 0 24 24">
        <rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 7l1.5-3h3L15 7" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="13.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v12m-5-5l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 20V8m-5 5l5-5 5 5M5 4h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M5 7h14M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 0 1-15 6.7M3 12a9 9 0 0 1 15-6.7M21 4v5h-5M3 20v-5h5"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-dumbbell" viewBox="0 0 24 24">
        <path d="M3 9v6M21 9v6M5 6v12M19 6v12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M5 12h14" stroke="currentColor" stroke-width="2.5"/>
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24">
        <path d="M8 5h8v4a4 4 0 0 1-8 0V5z M5 5H3v2a3 3 0 0 0 3 3 M19 5h2v2a3 3 0 0 1-3 3 M9 13h6 M10 17h4 M9 17v-3 M15 17v-3 M8 21h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-scale" viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 11h6 M12 11v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v3 M12 19v3 M4.2 4.2l2.1 2.1 M17.7 17.7l2.1 2.1 M2 12h3 M19 12h3 M4.2 19.8l2.1-2.1 M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-arrow-r" viewBox="0 0 24 24">
        <path d="M5 12h14m-6-6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-skip" viewBox="0 0 24 24">
        <path d="M5 4l9 8-9 8V4z M19 4v16" fill="currentColor"/>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <rect x="6" y="5" width="4" height="14" fill="currentColor"/>
        <rect x="14" y="5" width="4" height="14" fill="currentColor"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24">
        <path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z" fill="currentColor"/>
      </symbol>
      <symbol id="i-male" viewBox="0 0 24 24">
        <circle cx="10" cy="14" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M14 10l6-6m-5 0h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-female" viewBox="0 0 24 24">
        <circle cx="12" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 15v7m-3-4h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M21 11.5a8.5 8.5 0 1 1-15-5.5L4 21l5-2a8.5 8.5 0 0 0 12-7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 4h12a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H4z M4 4v16 M8 8h8 M8 12h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-swap" viewBox="0 0 24 24">
        <path d="M7 4l-3 3 3 3M4 7h12a4 4 0 0 1 0 8M17 20l3-3-3-3M20 17H8a4 4 0 0 1 0-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-mood-great" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M8 14a4 4 0 0 0 8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="9" cy="10" r="1" fill="currentColor"/>
        <circle cx="15" cy="10" r="1" fill="currentColor"/>
      </symbol>
      <symbol id="i-mood-ok" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M8 15h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="9" cy="10" r="1" fill="currentColor"/>
        <circle cx="15" cy="10" r="1" fill="currentColor"/>
      </symbol>
      <symbol id="i-mood-low" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M8 16a4 4 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="9" cy="10" r="1" fill="currentColor"/>
        <circle cx="15" cy="10" r="1" fill="currentColor"/>
      </symbol>
      <symbol id="i-note" viewBox="0 0 24 24">
        <path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z M16 4v3h3 M8 12h8 M8 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- 启动遮罩 -->
    <div id="splash" class="splash">
      <svg class="splash-icon" viewBox="0 0 24 24" width="56" height="56"><use href="#i-dumbbell"/></svg>
      <div class="splash-title">训练计划</div>
    </div>

    <!-- 容量警告条 -->
    <div id="storage-warning" class="storage-warning hidden">
      <span>存储空间接近上限,建议导出备份</span>
      <button data-action="dismiss-warning"><svg viewBox="0 0 24 24" width="16" height="16"><use href="#i-x"/></svg></button>
    </div>

    <!-- 离线状态徽标 -->
    <div id="offline-pill" class="offline-pill hidden">
      <span class="offline-dot"></span>离线
    </div>

    <!-- 引导问卷容器 -->
    <div id="onboarding-root" class="screen hidden"></div>

    <!-- 专注训练模式容器 -->
    <div id="workout-root" class="screen workout-screen hidden"></div>

    <!-- AI 聊天容器 -->
    <div id="chat-root" class="screen chat-screen hidden"></div>

    <!-- 主界面容器 -->
    <main id="main-root" class="main hidden">
      <section id="view-today" class="view"></section>
      <section id="view-plan" class="view hidden"></section>
      <section id="view-me" class="view hidden"></section>
    </main>

    <!-- 底部 tab bar -->
    <nav id="tab-bar" class="tab-bar hidden" aria-label="主导航">
      <button class="tab active" data-tab="today" aria-label="今日训练">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-today"/></svg>
        <span class="tab-label">今日</span>
      </button>
      <button class="tab" data-tab="plan" aria-label="本周计划">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plan"/></svg>
        <span class="tab-label">计划</span>
      </button>
      <button class="tab" data-tab="chat" aria-label="教练对话">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg>
        <span class="tab-label">教练</span>
      </button>
      <button class="tab" data-tab="me" aria-label="我的">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-me"/></svg>
        <span class="tab-label">我的</span>
      </button>
    </nav>

    <!-- 全屏倒计时遮罩 -->
    <div id="timer-overlay" class="timer-overlay hidden">
      <div class="timer-content">
        <div class="timer-label">组间休息</div>
        <div class="timer-ring-wrap">
          <svg class="timer-ring" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
            <circle id="timer-ring-fg" cx="60" cy="60" r="54" fill="none"
              stroke="#E85D24" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="339.292" stroke-dashoffset="0"
              transform="rotate(-90 60 60)"/>
          </svg>
          <div id="timer-display" class="timer-display">90</div>
        </div>
        <div class="timer-actions">
          <button id="timer-pause" class="btn btn-secondary">暂停</button>
          <button id="timer-add" class="btn btn-secondary">+15s</button>
          <button id="timer-skip" class="btn btn-primary">跳过</button>
        </div>
      </div>
    </div>

    <!-- 通用模态 -->
    <div id="modal-root" class="modal hidden"></div>

    <!-- 独立 loading 容器(避免和模态冲突)-->
    <div id="loading-root" class="loading-overlay hidden"></div>


    <!-- Toast 容器 -->
    <div id="toast-root" class="toast-root"></div>

    <!-- 庆祝遮罩(完成今日训练) -->
    <div id="celebration-overlay" class="celebration-overlay hidden">
      <div class="celebration-content">
        <div class="celebration-check">
          <svg viewBox="0 0 24 24" width="64" height="64"><use href="#i-check"/></svg>
        </div>
        <div class="celebration-title">今日训练完成</div>
        <div class="celebration-sub" id="celebration-sub"></div>
        <button class="btn btn-primary" id="celebration-close">好</button>
      </div>
    </div>
  </div>

  <script src="js/data/exercises.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/weight_ref.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ai_planner.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/onboarding.js"></script>
  <script src="js/views/workout.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/chat.js"></script>
  <script src="js/views/body_map.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/me.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
